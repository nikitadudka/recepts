<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="870" viewBox="0 0 1170 870" role="img" aria-labelledby="title desc"><title id="title">A06.1 — кандидаты иконок По сезону и Наша Крошка</title><desc id="desc">Схемы для согласования A06.1. Не реализация. Вымышленные данные, текущая кошка не изменена.</desc><style>text{font-family:Arial,sans-serif}</style><rect x="0" y="0" width="1170" height="870" rx="0" fill="#e7e7e2" stroke="none"/><text x="24" y="40" font-size="26" fill="#2f4235" >Крошка · A06.1 · варианты свотчей</text><text x="24" y="72" font-size="16" fill="#2f4235" >Эскизы для выбора направления. Ничего не заменено в приложении.</text><text x="24" y="120" font-size="16" fill="#2f4235" >Набор</text><text x="280" y="120" font-size="16" fill="#2f4235" >По сезону</text><text x="590" y="120" font-size="16" fill="#2f4235" >Наша Крошка</text><text x="860" y="120" font-size="16" fill="#2f4235" >Halloween</text><rect x="24" y="145" width="1120" height="170" rx="12" fill="#fbfcf9" stroke="#65745e"/><text x="40" y="181" font-size="16" fill="#2f4235" >A · книга и лист · рекомендуем</text><rect x="280" y="201" width="56" height="64" rx="12" fill="#f0eadf" stroke="#65745e"/><g transform="translate(290 221)" fill="none" stroke="#3f6049" stroke-width="1.7" stroke-linejoin="round"><path d="M18 4Q10 0 0 3v22q10-3 18 2q8-5 18-2V3q-10-3-18 1v23"/><path d="M18 4q8-4 18-1v22q-10-3-18 2" fill="#3e2d39" stroke="#3f6049"/></g><path d="M318 210a5 5 0 1 0 5 7a6 6 0 0 1-5-7" fill="#d39762"/><path d="M295 215q-5-10 5-9q3 7-5 9m0 0l6-7" fill="#a6b993" stroke="#3f6049" stroke-width="1.5"/><rect x="590" y="201" width="56" height="64" rx="12" fill="#edf2e9" stroke="#65745e"/><g transform="translate(600 221)" fill="none" stroke="#3f6049" stroke-width="1.7" stroke-linejoin="round"><path d="M18 4Q10 0 0 3v22q10-3 18 2q8-5 18-2V3q-10-3-18 1v23"/></g><path d="M605 215q-5-10 5-9q3 7-5 9m0 0l6-7" fill="#a6b993" stroke="#3f6049" stroke-width="1.5"/><rect x="860" y="201" width="56" height="64" rx="12" fill="#2b1e2d" stroke="#b99bac"/><path d="M885 215a16 16 0 1 0 13 24a18 18 0 0 1-13-24" fill="none" stroke="#e4ad69" stroke-width="2"/><text x="932" y="236" font-size="14" fill="#2f4235" >сохранить</text><text x="932" y="258" font-size="14" fill="#2f4235" >нынешний месяц</text><text x="356" y="239" font-size="14" fill="#53634e" >Книга: день / ночь</text><text x="666" y="239" font-size="14" fill="#53634e" >Светлая книга</text><rect x="24" y="335" width="1120" height="170" rx="12" fill="#fbfcf9" stroke="#65745e"/><text x="40" y="371" font-size="16" fill="#2f4235" >B · сезонный медальон / тарелка</text><rect x="280" y="391" width="56" height="64" rx="12" fill="#f0eadf" stroke="#65745e"/><circle cx="308" cy="423" r="19" fill="#edf2e9" stroke="#65745e" stroke-width="1.7"/><path d="M308 404a19 19 0 0 1 0 38Z" fill="#3e2d39"/><path d="M314 414a8 8 0 1 0 7 12a9 9 0 0 1-7-12" fill="#e4ad69"/><path d="M295 427q-3-14 9-13q2 10-9 13m0 0l8-10" fill="#a6b993" stroke="#3f6049" stroke-width="1.7"/><rect x="590" y="391" width="56" height="64" rx="12" fill="#f0eadf" stroke="#65745e"/><circle cx="618" cy="423" r="20" fill="#fbfcf9" stroke="#65745e" stroke-width="1.7"/><circle cx="618" cy="423" r="14" fill="none" stroke="#65745e"/><path d="M612 434l12-23m-7 15q-12-1-8-8q8 0 8 8m4-8q-2-9 6-8q2 6-6 8" fill="#a6b993" stroke="#3f6049" stroke-width="1.5"/><rect x="860" y="391" width="56" height="64" rx="12" fill="#2b1e2d" stroke="#b99bac"/><path d="M885 405a16 16 0 1 0 13 24a18 18 0 0 1-13-24" fill="none" stroke="#e4ad69" stroke-width="2"/><text x="932" y="426" font-size="14" fill="#2f4235" >сохранить</text><text x="932" y="448" font-size="14" fill="#2f4235" >нынешний месяц</text><text x="356" y="429" font-size="14" fill="#53634e" >Лист и месяц</text><text x="666" y="429" font-size="14" fill="#53634e" >Тарелка с веточкой</text><rect x="24" y="525" width="1120" height="170" rx="12" fill="#fbfcf9" stroke="#65745e"/><text x="40" y="561" font-size="16" fill="#2f4235" >C · миниатюры палитры</text><rect x="280" y="581" width="56" height="64" rx="12" fill="#edf2e9" stroke="#65745e"/><rect x="307" y="589" width="21" height="47" rx="4" fill="#3e2d39" stroke="#65745e"/><rect x="288" y="589" width="21" height="47" rx="4" fill="#fbfcf9" stroke="#65745e"/><path d="M295 607q7-3 13 1q6-4 13-1v14q-7-3-13 1q-6-4-13-1Zm13 1v14" fill="none" stroke="#a6b993" stroke-width="1.7"/><rect x="590" y="581" width="56" height="64" rx="12" fill="#edf2e9" stroke="#65745e"/><rect x="598" y="589" width="40" height="47" rx="4" fill="#fbfcf9" stroke="#65745e"/><path d="M605 607q7-3 13 1q6-4 13-1v14q-7-3-13 1q-6-4-13-1Zm13 1v14" fill="none" stroke="#3f6049" stroke-width="1.7"/><rect x="860" y="581" width="56" height="64" rx="12" fill="#2b1e2d" stroke="#b99bac"/><path d="M885 595a16 16 0 1 0 13 24a18 18 0 0 1-13-24" fill="none" stroke="#e4ad69" stroke-width="2"/><text x="932" y="616" font-size="14" fill="#2f4235" >сохранить</text><text x="932" y="638" font-size="14" fill="#2f4235" >нынешний месяц</text><text x="356" y="619" font-size="14" fill="#53634e" >Две поверхности</text><text x="666" y="619" font-size="14" fill="#53634e" >Светлая поверхность</text><text x="24" y="765" font-size="16" fill="#2f4235" >Финал: SVG с контурами, без emoji, blur и внешних шрифтов. Знак 28–32 px, внутренние поля ≥4 px.</text><text x="24" y="795" font-size="16" fill="#2f4235" >Проверить Safari @2x/@3x, обе темы, выбранность и перенос подписей. Цвета — из нынешнего бренда.</text><text x="24" y="832" font-size="16" fill="#2f4235" >Иллюстрации здесь показывают направление; окончательная графика и её замена требуют выбора владельца.</text></svg>
