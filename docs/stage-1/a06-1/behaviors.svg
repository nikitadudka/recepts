<rect x="807" y="194" width="72" height="72" rx="8" fill="#edf2e9" stroke="#65745e"/>
<text x="843" y="235" font-size="14" fill="#53634e" text-anchor="middle">фото</text>
<text x="891" y="214" font-size="18" fill="#2f4235" >Суп с чечевицей</text>
<text x="891" y="238" font-size="18" fill="#2f4235" >и печёной</text>
<text x="891" y="262" font-size="18" fill="#2f4235" >морковью</text>
<rect x="1097" y="278" width="44" height="44" rx="8" fill="#fff" stroke="#65745e"/>
<text x="1119" y="308" font-size="28" fill="#2f4235" text-anchor="middle">♡</text>
<text x="807" y="306" font-size="14" fill="#53634e" >Чечевица · морковь · лук</text>
<text x="807" y="340" font-size="14" fill="#53634e" >Обед · Без мяса</text>
<text x="807" y="374" font-size="14" fill="#53634e" >Варить · 30 мин</text>
<text x="807" y="408" font-size="14" fill="#53634e" >Б 5 · Ж 2 · У 12</text>
<text x="807" y="442" font-size="14" fill="#53634e" >на 100 г</text>
<text x="791" y="574" font-size="14" fill="#2f4235" >Название полностью. Метаданные</text>
<text x="791" y="598" font-size="14" fill="#2f4235" >переносятся под миниатюру.</text>
<text x="791" y="622" font-size="14" fill="#2f4235" >Избранное — отдельная цель 44 px.</text>
<text x="775" y="706" font-size="18" fill="#2f4235" >Loading / empty</text>
<rect x="775" y="728" width="390" height="96" rx="8" fill="#fbfcf9" stroke="#65745e"/>
<text x="791" y="760" font-size="16" fill="#2f4235" >Загружаем рецепты…</text>
<text x="791" y="791" font-size="13" fill="#53634e" >Не показываем пустую книгу до GET.</text>
<rect x="775" y="840" width="390" height="96" rx="8" fill="#fbfcf9" stroke="#65745e"/>
<text x="791" y="872" font-size="16" fill="#2f4235" >По этим условиям ничего не найдено</text>
<text x="791" y="903" font-size="13" fill="#53634e" >Очистить поиск / Сбросить фильтры</text>
<rect x="775" y="952" width="390" height="96" rx="8" fill="#fbfcf9" stroke="#65745e"/>
<text x="791" y="984" font-size="16" fill="#2f4235" >Пока нет рецептов</text>
<text x="791" y="1015" font-size="13" fill="#53634e" >Добавить рецепт / Вдохновение</text>
<rect x="775" y="1064" width="390" height="96" rx="8" fill="#fbfcf9" stroke="#65745e"/>
<text x="791" y="1096" font-size="16" fill="#2f4235" >Здесь будут избранные рецепты</text>
<text x="791" y="1127" font-size="13" fill="#53634e" >Отметьте рецепт сердечком.</text>
<rect x="775" y="1176" width="390" height="96" rx="8" fill="#fbfcf9" stroke="#65745e"/>
<text x="791" y="1208" font-size="16" fill="#2f4235" >Что хочется приготовить?</text>
<text x="791" y="1239" font-size="13" fill="#53634e" >Найти идею в каталоге</text>
<text x="1195" y="105" font-size="18" fill="#2f4235" >Связь и запись · в потоке</text>
<rect x="1195" y="124" width="430" height="110" rx="8" fill="#edf2e9" stroke="#65745e"/>
<text x="1211" y="156" font-size="16" fill="#2f4235" >Связь с книгой установлена</text>
<text x="1211" y="188" font-size="14" fill="#53634e" >Обычный GET не подтверждает запись.</text>
<rect x="1195" y="254" width="430" height="110" rx="8" fill="#edf2e9" stroke="#65745e"/>
<text x="1211" y="286" font-size="16" fill="#2f4235" >Сохраняем изменение…</text>
<text x="1211" y="318" font-size="14" fill="#53634e" >Ждём ответ конкретной операции.</text>
<rect x="1195" y="384" width="430" height="110" rx="8" fill="#edf2e9" stroke="#65745e"/>
<text x="1211" y="416" font-size="16" fill="#2f4235" >Изменение сохранено</text>
<text x="1211" y="448" font-size="14" fill="#53634e" >Только после подтверждения сервера.</text>
<rect x="1195" y="514" width="430" height="110" rx="8" fill="#fff0ed" stroke="#65745e"/>
<text x="1211" y="546" font-size="16" fill="#2f4235" >Изменение не сохранено</text>
<text x="1211" y="578" font-size="14" fill="#53634e" >Постоянно, даже после успешного GET.</text>
<text x="1211" y="604" font-size="14" fill="#2f4235" >Повторите действие у рецепта.</text>
<rect x="1195" y="644" width="430" height="110" rx="8" fill="#fff0ed" stroke="#65745e"/>
<text x="1211" y="676" font-size="16" fill="#2f4235" >Нет связи с книгой</text>
<text x="1211" y="708" font-size="14" fill="#53634e" >Открытые данные могут быть неактуальны.</text>
<text x="1211" y="734" font-size="14" fill="#2f4235" >Проверить связь → только GET</text>
<rect x="1195" y="774" width="430" height="110" rx="8" fill="#fff0ed" stroke="#65745e"/>
<text x="1211" y="806" font-size="16" fill="#2f4235" >Не удалось подтвердить сохранение</text>
<text x="1211" y="838" font-size="14" fill="#53634e" >Сначала сверить актуальный результат.</text>
<rect x="1195" y="904" width="430" height="110" rx="8" fill="#fff0ed" stroke="#65745e"/>
<text x="1211" y="936" font-size="16" fill="#2f4235" >Нет сети</text>
<text x="1211" y="968" font-size="14" fill="#53634e" >Для сохранения нужна связь с книгой.</text>
<rect x="1195" y="1034" width="430" height="110" rx="8" fill="#fff0ed" stroke="#65745e"/>
<text x="1211" y="1066" font-size="16" fill="#2f4235" >Сеанс завершён</text>
<text x="1211" y="1098" font-size="14" fill="#53634e" >Войдите снова. Нет автоматического retry.</text>
<text x="1195" y="1205" font-size="14" fill="#2f4235" >Ошибки дополнительно у инициатора.</text>
<text x="1195" y="1230" font-size="14" fill="#2f4235" >Один live-источник, цвет + текст.</text>
<text x="1195" y="1255" font-size="14" fill="#2f4235" >Нет replay устаревшей книги.</text>
