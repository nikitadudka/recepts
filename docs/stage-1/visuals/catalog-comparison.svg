<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1120" viewBox="0 0 980 1120" role="img" aria-labelledby="title desc"><title id="title">Каталог: сравнить рецепты, затем сохранить</title><desc id="desc">Слева случайный одиночный результат; справа поиск по той же области и обозримая выдача с порционной загрузкой.</desc><rect width="980" height="1120" fill="#e6ebe3"/><g font-family="Arial, sans-serif"><text x="40" y="42" font-size="28" fill="#2f4235" font-weight="700">Каталог: сравнить рецепты, затем сохранить</text><text x="40" y="72" font-size="16" fill="#53634e" font-weight="normal">Предложение v1 · 22.10.2026 · ожидает одобрения</text><text x="40" y="112" font-size="20" fill="#2f4235" font-weight="700">Сейчас · схема по скриншоту</text><rect x="40" y="132" width="390" height="844" rx="18" fill="#fbfcf9" stroke="#a6b49b"/><text x="40" y="1007" font-size="14" fill="#53634e" font-weight="normal">Основание: UX-07, mobile-classic-catalog.png</text><text x="540" y="112" font-size="20" fill="#2f4235" font-weight="700">Предлагается · A07</text><rect x="540" y="132" width="390" height="844" rx="18" fill="#fbfcf9" stroke="#a6b49b"/><text x="540" y="1007" font-size="14" fill="#53634e" font-weight="normal">Новый read-only API списка — после одобрения</text><text x="60" y="174" font-size="25" fill="#2f4235" font-weight="700">Книга вдохновения</text><rect x="364" y="184" width="46" height="44" rx="10" fill="white" stroke="#a6b49b"/><text x="376" y="212" font-size="15" fill="#2f4235" font-weight="600">×</text><text x="60" y="220" font-size="14" fill="#53634e" font-weight="normal">Идеи отдельно от вашей книги</text><text x="60" y="264" font-size="14" fill="#53634e" font-weight="normal">Поиск в каталоге</text><rect x="60" y="276" width="350" height="48" rx="10" fill="white" stroke="#a6b49b"/><text x="72" y="306" font-size="15" fill="#53634e" font-weight="normal">Название или ингредиенты</text><rect x="60" y="340" width="350" height="48" rx="10" fill="white" stroke="#a6b49b"/><text x="72" y="370" font-size="15" fill="#53634e" font-weight="normal">Все идеи</text><text x="60" y="416" font-size="13" fill="#53634e" font-weight="normal">По вашим условиям: 1567</text><rect x="40" y="438" width="390" height="218" rx="0" fill="#d6dfc5" stroke="#a6b49b"/><text x="162" y="554" font-size="24" fill="#53634e" font-weight="normal">Иллюстрация</text><text x="60" y="704" font-size="26" fill="#2f4235" font-weight="normal">Один случайный рецепт</text><text x="60" y="744" font-size="14" fill="#53634e" font-weight="normal">35 мин · Порций 4</text><text x="60" y="798" font-size="15" fill="#53634e" font-weight="normal">Ингредиенты и шаги ниже</text><rect x="60" y="852" width="350" height="44" rx="10" fill="white" stroke="#a6b49b"/><text x="72" y="880" font-size="15" fill="#2f4235" font-weight="600">Ещё рецепт</text><rect x="60" y="908" width="166" height="44" rx="10" fill="white" stroke="#a6b49b"/><text x="72" y="936" font-size="15" fill="#2f4235" font-weight="600">На пробу</text><rect x="240" y="908" width="170" height="44" rx="10" fill="#3f6049" stroke="#3f6049"/><text x="252" y="936" font-size="15" fill="white" font-weight="600">В книгу</text><text x="560" y="174" font-size="25" fill="#2f4235" font-weight="700">Каталог вдохновения</text><rect x="864" y="184" width="46" height="44" rx="10" fill="white" stroke="#a6b49b"/><text x="876" y="212" font-size="15" fill="#2f4235" font-weight="600">×</text><text x="560" y="220" font-size="14" fill="#53634e" font-weight="normal">Идеи отдельно от вашей книги</text><text x="560" y="264" font-size="14" fill="#53634e" font-weight="normal">Поиск в каталоге</text><rect x="560" y="276" width="350" height="48" rx="10" fill="white" stroke="#a6b49b"/><text x="572" y="306" font-size="15" fill="#53634e" font-weight="normal">Чечевица</text><rect x="560" y="340" width="166" height="48" rx="10" fill="white" stroke="#a6b49b"/><text x="572" y="370" font-size="15" fill="#53634e" font-weight="normal">Все идеи</text><rect x="740" y="340" width="170" height="48" rx="10" fill="white" stroke="#a6b49b"/><text x="752" y="370" font-size="15" fill="#53634e" font-weight="normal">По названию</text><text x="560" y="422" font-size="15" fill="#53634e" font-weight="normal">Найдено: 18</text><rect x="730" y="398" width="180" height="44" rx="10" fill="white" stroke="#a6b49b"/><text x="742" y="426" font-size="15" fill="#2f4235" font-weight="600">Случайная идея</text><rect x="560" y="458" width="350" height="104" rx="10" fill="white" stroke="#a6b49b"/><rect x="572" y="470" width="80" height="80" rx="8" fill="#edf2e6" stroke="#a6b49b"/><text x="586" y="513" font-size="14" fill="#53634e" font-weight="normal">Фото</text><text x="666" y="488" font-size="17" fill="#2f4235" font-weight="600">Суп из чечевицы</text><text x="666" y="511" font-size="17" fill="#2f4235" font-weight="600">с овощами</text><text x="666" y="536" font-size="14" fill="#53634e" font-weight="normal">35 мин · Блюдо</text><rect x="560" y="574" width="350" height="104" rx="10" fill="white" stroke="#a6b49b"/><rect x="572" y="586" width="80" height="80" rx="8" fill="#edf2e6" stroke="#a6b49b"/><text x="586" y="629" font-size="14" fill="#53634e" font-weight="normal">Фото</text><text x="666" y="604" font-size="17" fill="#2f4235" font-weight="600">Тёплый салат</text><text x="666" y="627" font-size="17" fill="#2f4235" font-weight="600">с чечевицей</text><text x="666" y="652" font-size="14" fill="#53634e" font-weight="normal">35 мин · Блюдо</text><rect x="560" y="690" width="350" height="104" rx="10" fill="white" stroke="#a6b49b"/><rect x="572" y="702" width="80" height="80" rx="8" fill="#edf2e6" stroke="#a6b49b"/><text x="586" y="745" font-size="14" fill="#53634e" font-weight="normal">Фото</text><text x="666" y="720" font-size="17" fill="#2f4235" font-weight="600">Чечевичные котлеты</text><text x="666" y="768" font-size="14" fill="#53634e" font-weight="normal">35 мин · Блюдо</text><rect x="560" y="812" width="350" height="44" rx="10" fill="white" stroke="#a6b49b"/><text x="572" y="840" font-size="15" fill="#2f4235" font-weight="600">Показать ещё · загружено 12 из 18</text><rect x="560" y="876" width="350" height="72" rx="10" fill="#edf2e6" stroke="#a6b49b"/><text x="572" y="904" font-size="13" fill="#2f4235" font-weight="normal">Открыть → детали → «На пробу» / «В книгу»</text><text x="572" y="928" font-size="13" fill="#53634e" font-weight="normal">Назад: те же условия, позиция и фокус</text><text x="40" y="1050" font-size="16" fill="#2f4235" font-weight="normal">q + раздел + сортировка; список по 12. Random остаётся отдельным действием, сохранение — из деталей.</text><text x="40" y="1080" font-size="14" fill="#53634e" font-weight="normal">SVG — схема. Размеры и поведение уточнены в MOBILE_UX_SPEC.md; работающий сайт не изменён.</text></g></svg>