name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline ${{ matrix.run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Prepare isolated test tools
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/kroshka-browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          python -m venv "$RUNNER_TEMP/kroshka-venv"
          echo "$RUNNER_TEMP/kroshka-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/kroshka-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r tests/requirements.txt
          "$RUNNER_TEMP/kroshka-venv/bin/python" -m playwright install --with-deps chromium
      - name: Select bundled Chromium
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('CHROMIUM_EXECUTABLE=' + p.chromium.executable_path + '\n')
          PY
      - name: Record environment
        run: |
          cat /etc/os-release
          echo "Runner image: $ImageOS $ImageVersion"
          node --version
          python --version
          python -m pip --version
          python -m pip freeze
          python tests/browser_environment.py
      - name: Syntax checks
        run: npm run check
      - name: Full existing suite
        run: npm test
      - name: Verify failure propagation and cleanup
        if: matrix.run == 1
        run: python tests/ci_failure_checks.py
